<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - TeamTasks</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body class="dashboard-body">
    <!-- Navigation -->
    <nav class="top-nav">
        <div class="nav-brand">TeamTasks</div>
        <div class="nav-user">
            <span id="welcomeMessage">Loading...</span>
            <button id="logoutBtn" class="btn-secondary">Log Out</button>
        </div>
    </nav>

    <!-- Main Kanban Board -->
    <main class="board-container">
        <!-- To Do Column -->
        <div class="column">
            <div class="column-header">
                <h2>To Do</h2>
                <span class="count" id="todo-count">0</span>
            </div>
            <div class="task-list" id="col-todo"></div>
        </div>

        <!-- In Progress Column -->
        <div class="column">
            <div class="column-header">
                <h2>In Progress</h2>
                <span class="count" id="inprogress-count">0</span>
            </div>
            <div class="task-list" id="col-in_progress"></div>
        </div>

        <!-- Done Column -->
        <div class="column">
            <div class="column-header">
                <h2>Done</h2>
                <span class="count" id="done-count">0</span>
            </div>
            <div class="task-list" id="col-done"></div>
        </div>
    </main>

    <!-- Floating Action Button -->
    <button id="fabNewTask" class="fab">+</button>

    <!-- New Task Modal (Inline Form) -->
    <div id="taskModal" class="modal-overlay" hidden>
        <div class="modal-content login-card"> <!-- Reusing login-card styles -->
            <div class="header" style="margin-bottom: 1.5rem;">
                <h2 style="font-size: 1.5rem;">New Task</h2>
            </div>
            <form id="newTaskForm">
                <div class="form-group">
                    <label for="taskTitle">Title</label>
                    <input type="text" id="taskTitle" required>
                </div>
                <div class="form-group">
                    <label for="taskDesc">Description</label>
                    <input type="text" id="taskDesc">
                </div>
                <div class="form-group">
                    <label for="taskPriority">Priority</label>
                    <select id="taskPriority" class="form-select">
                        <option value="low">Low</option>
                        <option value="medium" selected>Medium</option>
                        <option value="high">High</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="taskAssignee">Assign To (User ID)</label>
                    <input type="number" id="taskAssignee" placeholder="e.g. 1 for Alice" required>
                </div>
                <div style="display: flex; gap: 10px; margin-top: 1.5rem;">
                    <button type="button" id="cancelTaskBtn" class="btn-secondary" style="margin-top: 0;">Cancel</button>
                    <button type="submit" style="margin-top: 0;">Create Task</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
